- name: Compilar ejecutable con PyInstaller
  run: |
    python -m pip install --upgrade pip
    pip install pyinstaller
    pyinstaller --noconfirm --clean --onefile --windowed --name="DBZ STORY EDITOR V1.3" --icon="BT3_no_green.ico" "DBZ STORY EDITOR V1.3_con_icono.py"
        name: DBZ-Story-Editor-Windows
        path: dist/
        
