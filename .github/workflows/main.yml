name: Compilar EXE de Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar PyInstaller y dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path "requirements.txt") { pip install -r requirements.txt }

    - name: Compilar ejecutable con PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --icon="BT3_no_green.ico" "DBZ STORY EDITOR V1.3.py"

    - name: Subir ejecutable como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: DBZ-Story-Editor-Windows
        path: dist/
