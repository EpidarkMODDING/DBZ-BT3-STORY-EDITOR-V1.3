name: Build Executable

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon="BT3_no_green.ico" --name "DBZ_STORY_EDITOR_1.3" "DBZ STORY EDITOR 1.3.py"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBZ-STORY-EDITOR-Windows
          path: dist/DBZ_STORY_EDITOR_1.3/
